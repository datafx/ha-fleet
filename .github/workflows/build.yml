name: Build app image

on:
  push:
    branches: [main]
    paths: ["fleet/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["fleet/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version and image from config.yaml
        id: meta
        run: |
          echo "version=$(yq -r '.version' fleet/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=$(yq -r '.image' fleet/config.yaml | sed 's/{arch}/amd64/')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: fleet
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.arch=amd64
            io.hass.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
